[api.cudensitymatEigenDecompositionCompute.argtypes]
6 = "CuPtr{Cdouble}"
9 = "CuPtr{Cvoid}"

[api.cudensitymatElementaryOperatorAttachBuffer.argtypes]
3 = "CuPtr{Cvoid}"

[api.cudensitymatMatrixOperatorDenseLocalAttachBuffer.argtypes]
3 = "CuPtr{Cvoid}"
